<!doctype html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVC Collection — Admin</title>
<style>
:root{font-family:Arial,sans-serif;color:#10233f;background:#f4f7fc;--blue:#3568e8;--line:#e7edf5;--muted:#7d8ba2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#edf2f8;color:#24354f}.good{background:#e9f8f1;color:#13845d}.danger{background:#fff0f1;color:#b42318}.hidden{display:none!important}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#10233f;color:#fff;padding:22px}.side h2{font-size:19px}.side button{width:100%;margin:4px 0;text-align:left;background:transparent;color:#dce6f5}.side button:hover,.side button.active{background:#25477a}.main{max-width:1400px;width:100%;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:26px;margin-top:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted)}input[type=email],input[type=password],input[type=file],input[type=search]{padding:10px;border:1px solid #cfd8e5;border-radius:8px}.login{max-width:440px;margin:9vh auto}.notice{padding:12px;border-radius:9px;background:#eef4ff;margin:10px 0}.err{background:#fff0f1;color:#9e2939}.ok{background:#eaf8f1;color:#13714f}.loading{color:var(--muted)}button:disabled{opacity:.6;cursor:wait}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:static;padding:10px;display:flex;flex-wrap:wrap;gap:5px}.side h2{width:100%;margin:5px}.side button{width:auto}.main{padding:12px}}
</style></head><body>
<section id="auth" class="card login"><h1>PVC Collection Admin</h1><p class="muted">Sign in with an authorized administrator account.</p><div id="loginError" class="notice err hidden" role="alert"></div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required style="width:100%;margin:8px 0 14px"><button class="primary" id="loginButton">Sign in</button></form></section>
<div id="workspace" class="shell hidden"><aside class="side"><h2>PVC Collection</h2><button data-tab="dashboard" class="active">Overview</button><button data-tab="users">Users</button><button data-tab="logs">Activity logs</button><button data-tab="imports">Customer import</button><button id="employee">Employee portal ↗</button><button id="logout">Sign out</button></aside><main class="main"><header class="row"><div><div class="muted">Administration</div><h1 id="title">Overview</h1></div><div id="adminName" class="muted"></div></header><section id="view"></section></main></div>
<script>
const WEB_APP_URL=<?!= JSON.stringify(WEB_APP_URL) ?>;let token='';let currentTab='dashboard';let users=[];const $=id=>document.getElementById(id);function esc(v){const x=document.createElement('span');x.textContent=v==null?'':String(v);return x.innerHTML}function api(name,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[name](...args))}function err(e){let m=String(e&&e.message||e||'Request failed.');if(/session expired|administrator access|required/i.test(m)){token='';$('workspace').classList.add('hidden');$('auth').classList.remove('hidden');return 'Session expired or access denied. Please sign in again.'}return m}function fmt(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginButton');b.disabled=true;b.textContent='Signing in…';$('loginError').classList.add('hidden');try{const r=await api('loginUser',{email:$('email').value,password:$('password').value});if(!r||!r.user||r.user.role!=='ADMIN'||!r.sessionToken)throw Error('This account does not have administrator access.');token=r.sessionToken;$('adminName').textContent=r.user.fullName||r.user.email;$('auth').classList.add('hidden');$('workspace').classList.remove('hidden');await show('dashboard')}catch(e){$('loginError').textContent=String(e&&e.message||e);$('loginError').classList.remove('hidden')}finally{b.disabled=false;b.textContent='Sign in'}};
async function show(tab){currentTab=tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('title').textContent=({dashboard:'Overview',users:'User management',logs:'Activity logs',imports:'Customer import'})[tab];$('view').innerHTML='<div class="card loading">Loading…</div>';try{if(tab==='dashboard')await dashboard();if(tab==='users')await loadUsers();if(tab==='logs')await logs();if(tab==='imports')imports()}catch(e){$('view').innerHTML=`<div class="card notice err">${esc(err(e))}</div>`}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('employee').onclick=()=>window.open(String(WEB_APP_URL).replace(/\/+$/,''),'_blank','noopener');$('logout').onclick=async()=>{const t=token;token='';$('workspace').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value='';if(t)try{await api('logoutUser',t)}catch(e){}};
async function dashboard(){const d=await api('adminGetDashboard',token);const stats=[['Total searches',d.totalSearches],['Successful',d.successfulSearches],['No match',d.failedSearches],['WhatsApp clicks',d.whatsappClicks]];$('view').innerHTML=`<div class="grid">${stats.map(x=>`<article class="card stat"><span class="muted">${x[0]}</span><strong>${Number(x[1])||0}</strong></article>`).join('')}</div><div class="card"><h2>Search volume by day</h2><div class="tablewrap"><table><tr><th>Date</th><th>Searches</th></tr>${Object.keys(d.byDay||{}).sort().slice(-14).reverse().map(k=>`<tr><td>${esc(k)}</td><td>${Number(d.byDay[k])||0}</td></tr>`).join('')||'<tr><td colspan="2">No activity yet.</td></tr>'}</table></div></div><div class="card"><h2>Latest searches</h2>${recentTable(d.recent||[])}</div><div class="card"><h2>Top active employees</h2><div class="tablewrap"><table><tr><th>Name</th><th>Email</th><th>Searches</th><th>Successful</th><th>WhatsApp</th></tr>${(d.topUsers||[]).map(u=>`<tr><td>${esc(u.fullName)}</td><td>${esc(u.email)}</td><td>${u.searches||0}</td><td>${u.successful||0}</td><td>${u.whatsappClicks||0}</td></tr>`).join('')||'<tr><td colspan="5">No activity yet.</td></tr>'}</table></div></div>`}
function recentTable(rows){return `<div class="tablewrap"><table><tr><th>Time</th><th>User</th><th>Type</th><th>Outcome</th><th>Results</th></tr>${rows.map(x=>`<tr><td>${fmt(x.timestamp)}</td><td>${esc(x.userName||x.email)}</td><td>${esc(x.searchType)}</td><td>${x.found?'Match':'No match'}</td><td>${Number(x.resultCount)||0}</td></tr>`).join('')||'<tr><td colspan="5">No recent searches.</td></tr>'}</table></div>`}
async function loadUsers(){users=await api('adminGetUsers',token);$('view').innerHTML=`<div class="card"><div class="row"><h2>Users (${users.length})</h2><input id="filter" type="search" placeholder="Filter name, email, status"></div><div id="userRows" class="tablewrap"></div></div>`;$('filter').oninput=renderUsers;renderUsers()}
function renderUsers(){const q=($('filter')?.value||'').toLowerCase();const filtered=users.filter(u=>`${u.fullName} ${u.email} ${u.status} ${u.role}`.toLowerCase().includes(q));$('userRows').innerHTML=`<table><tr><th>User</th><th>Role</th><th>Status</th><th>Verified</th><th>Created</th><th>Actions</th></tr>${filtered.map(u=>{const primary=u.email.toLowerCase()===String($('adminName').dataset.email||'').toLowerCase();return `<tr><td>${esc(u.fullName)}<br><span class="muted">${esc(u.email)}</span></td><td>${esc(u.role)}</td><td>${esc(u.status)}</td><td>${u.emailVerified?'Yes':'No'}</td><td>${fmt(u.createdAt)}</td><td><div class="actions">${u.status==='PENDING'&&u.emailVerified?actionButton('Approve','adminApproveUser',u.userId,'good'):''}${u.status!=='REJECTED'&&u.status!=='DISABLED'&&!primary?actionButton('Reject','adminRejectUser',u.userId,'danger'):''}${u.status==='ACTIVE'&&!primary?actionButton('Disable','adminDisableUser',u.userId,'danger'):''}${u.status==='DISABLED'?actionButton('Reactivate','adminReactivateUser',u.userId,'good'):''}<select aria-label="Change role for ${esc(u.email)}" onchange="setRole('${escAttr(u.userId)}',this.value)"><option value="">Role…</option><option value="USER" ${u.role==='USER'?'selected':''}>USER</option><option value="ADMIN" ${u.role==='ADMIN'?'selected':''}>ADMIN</option></select></div></td></tr>`}).join('')||'<tr><td colspan="6">No users found.</td></tr>'}</table>`}
function escAttr(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function actionButton(label,fn,id,cls){return `<button class="${cls}" onclick="userAction('${fn}','${escAttr(id)}')">${label}</button>`}async function userAction(fn,id){if(!confirm('Confirm this user change?'))return;try{await api(fn,token,id);await loadUsers()}catch(e){alert(err(e))}}async function setRole(id,role){if(!role)return;if(!confirm('Change this account role?')){await loadUsers();return}try{await api('adminSetUserRole',token,id,role);await loadUsers()}catch(e){alert(err(e));await loadUsers()}}
async function logs(){const d=await api('adminGetLogs',token);const section=(title,rows,cols,render)=>`<section class="card"><h2>${title}</h2><div class="tablewrap"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(render).join('')||`<tr><td colspan="${cols.length}">No records.</td></tr>`}</table></div></section>`;$('view').innerHTML=section('Administrator actions',d.adminActions,['Time','Admin','Action','Target','Details'],x=>`<tr><td>${fmt(x.timestamp)}</td><td>${esc(x.adminEmail)}</td><td>${esc(x.action)}</td><td>${esc(x.targetEmail)}</td><td>${esc(x.details)}</td></tr>`)+section('Customer searches',d.searches,['Time','User','Type','Query','Results','Outcome'],x=>`<tr><td>${fmt(x.timestamp)}</td><td>${esc(x.userEmail)}</td><td>${esc(x.searchType)}</td><td>${esc(x.query)}</td><td>${x.resultCount||0}</td><td>${x.success?'Success':'No match'}</td></tr>`)+section('User activity',d.activity,['Time','User','Event','Type','Results','Details'],x=>`<tr><td>${fmt(x.timestamp)}</td><td>${esc(x.userEmail)}</td><td>${esc(x.eventType)}</td><td>${esc(x.searchType)}</td><td>${x.resultCount||0}</td><td>${esc(x.details)}</td></tr>`)}
function imports(){$('view').innerHTML=`<section class="card"><h2>Append customer records</h2><p class="muted">Existing customer rows are not replaced. Required headers: Customer, Phone 1, Phone 2, Email 1, Email 2.</p><div class="actions"><button class="ghost" id="csvTemplate">Download CSV template</button><input id="file" type="file" accept=".csv,.xlsx,.xlsm,text/csv"><button class="primary" id="upload">Import selected file</button></div><div id="importMsg" class="notice hidden" role="status"></div></section>`;$('csvTemplate').onclick=()=>{const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('Customer,Phone 1,Phone 2,Email 1,Email 2\n');a.download='PVC_DB_Import_Template.csv';a.click()};$('upload').onclick=upload}
async function upload(){const f=$('file').files[0],msg=$('importMsg'),btn=$('upload');if(!f){msg.textContent='Select a CSV or XLSX file first.';msg.className='notice err';msg.classList.remove('hidden');return}const excel=/\.(xlsx|xlsm)$/i.test(f.name);if(!excel&&!/\.csv$/i.test(f.name)){msg.textContent='Choose a CSV or XLSX file.';msg.className='notice err';msg.classList.remove('hidden');return}const limit=excel?6*1024*1024:5*1024*1024;if(f.size>limit){msg.textContent='File is too large.';msg.className='notice err';msg.classList.remove('hidden');return}btn.disabled=true;msg.className='notice';msg.textContent='Importing… Keep this page open.';msg.classList.remove('hidden');try{let r;if(excel){const data=await new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(String(reader.result).split(',')[1]);reader.onerror=no;reader.readAsDataURL(f)});r=await api('importCustomerXlsx',token,data)}else r=await api('importCustomerCsv',token,await f.text());msg.textContent=`Import complete. Added ${r.added}; skipped ${r.skipped} duplicates. Phone index rebuilt: ${r.indexRebuilt?'yes':'no'}.`;msg.className='notice ok'}catch(e){msg.textContent=err(e);msg.className='notice err'}finally{btn.disabled=false;$('file').value=''}}
function escAttr(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
</script></body></html>
