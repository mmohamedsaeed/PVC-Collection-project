<!doctype html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVC Collection</title>
<style>
:root{font-family:Arial,sans-serif;color:#14233b;background:#f3f6fb;--blue:#2457d6;--line:#e3eaf3;--muted:#718096}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f8;color:#24354f}.danger{background:#fff0f1;color:#a52f3f}.wrap{max-width:1080px;margin:auto;padding:24px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 10px 28px #14233b0b}.auth{max-width:460px;margin:7vh auto}.brand{font-size:23px;font-weight:800}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cfd8e5;border-radius:9px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.link{color:var(--blue);cursor:pointer;margin:14px 0}.notice{padding:12px;border-radius:9px;background:#eef4ff;margin:12px 0}.error{background:#fff0f1;color:#9e2939}.success{background:#eaf8f1;color:#13714f}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.customer{border:1px solid var(--line);border-radius:12px;padding:16px}.field{margin:8px 0;overflow-wrap:anywhere}.field b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:22px;color:var(--muted);margin:10px 0}.busy{opacity:.65;pointer-events:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2457d655;outline-offset:2px}@media(max-width:600px){.wrap{padding:12px}.card{padding:16px}.row{flex-direction:column;align-items:stretch}}
</style></head><body><main id="app" class="wrap"></main>
<script>
const WEB_APP_URL=<?!= JSON.stringify(WEB_APP_URL) ?>;
const app=document.getElementById('app');
const state={token:null,user:null,busy:false};
function esc(v){const n=document.createElement('span');n.textContent=v==null?'':String(v);return n.innerHTML}
function message(text,kind='error'){const el=document.getElementById('message');if(el){el.textContent=text;el.className='notice '+kind;el.hidden=false}}
function safeError(e){const s=String(e&&e.message||e||'Request failed.');if(/session expired|login again/i.test(s))return 'Your session expired. Please sign in again.';if(/administrator access|required/i.test(s))return 'Access denied.';return s}
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args))}
function showLogin(){state.user=null;state.token=null;app.innerHTML=`<section class="card auth"><div class="brand">PVC Collection</div><p class="muted">Secure customer search portal</p><div id="message" hidden></div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p class="link" id="forgot">Forgot password?</p><button class="primary" id="submit" type="submit">Sign in</button></form><p class="link" id="signup">Create an account</p></section>`;
 document.getElementById('loginForm').onsubmit=login;document.getElementById('signup').onclick=showSignup;document.getElementById('forgot').onclick=()=>window.open(String(WEB_APP_URL).replace(/\/+$/,'')+'?action=reset','_blank','noopener');document.getElementById('email').focus()}
async function login(e){e.preventDefault();const b=document.getElementById('submit');b.disabled=true;b.textContent='Signing in…';try{const r=await call('loginUser',{email:document.getElementById('email').value,password:document.getElementById('password').value});if(!r||!r.sessionToken||!r.user)throw Error('Sign-in failed.');if(r.user.role==='ADMIN'){state.token=null;window.location.href=String(WEB_APP_URL).replace(/\/+$/,'')+'?action=admin';return}if(r.user.role!=='USER'){await call('logoutUser',r.sessionToken);throw Error('This account does not have permission to use the employee portal.')}state.token=r.sessionToken;state.user=r.user;showPortal()}catch(err){const m=safeError(err);if(/waiting for administrator approval/i.test(m)||/verify your email/i.test(m)){app.innerHTML=`<section class="card auth"><div class="brand">PVC Collection</div><h2>Account status</h2><p>${esc(m)}</p><button class="primary" id="back">Back to sign in</button></section>`;document.getElementById('back').onclick=showLogin}else message(m)}finally{if(document.getElementById('submit')){b.disabled=false;b.textContent='Sign in'}}}
function showSignup(){app.innerHTML=`<section class="card auth"><div class="brand">Create account</div><div id="message" hidden></div><form id="signupForm"><label>Full name (at least three names)</label><input id="fullName" autocomplete="name" required><label>Phone</label><input id="phone" inputmode="tel" required><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password (10–128 characters)</label><input id="password" type="password" minlength="10" maxlength="128" required><label>Confirm password</label><input id="confirm" type="password" minlength="10" maxlength="128" required><button class="primary" id="submit">Create account</button></form><p class="link" id="back">Back to sign in</p></section>`;document.getElementById('signupForm').onsubmit=signup;document.getElementById('back').onclick=showLogin}
async function signup(e){e.preventDefault();const b=document.getElementById('submit');b.disabled=true;try{const r=await call('signupUser',{fullName:document.getElementById('fullName').value,phone:document.getElementById('phone').value,email:document.getElementById('email').value,password:document.getElementById('password').value,confirmPassword:document.getElementById('confirm').value});app.innerHTML=`<section class="card auth"><div class="brand">Check your email</div><p>${esc(r.message||'Verify your email, then wait for administrator approval.')}</p><button class="primary" id="back">Back to sign in</button></section>`;document.getElementById('back').onclick=showLogin}catch(err){message(safeError(err))}finally{if(document.getElementById('submit'))b.disabled=false}}
function showPortal(){app.innerHTML=`<header class="card toolbar"><div><div class="brand">PVC Collection</div><span class="muted">Customer search · ${esc(state.user.fullName||state.user.email)}</span></div><div class="actions"><button class="secondary" id="stats">My activity</button><button class="secondary" id="logout">Sign out</button></div></header><section class="card"><h2>Search customers</h2><form id="searchForm" class="row"><select id="type" aria-label="Search type"><option value="name">Name</option><option value="phone">Phone</option><option value="email">Email</option></select><input id="query" aria-label="Search query" placeholder="Name, phone, or email" required><button class="primary" id="search">Search</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div id="results" class="results"></div></section><section id="statsPanel" class="card hidden"></section>`;document.getElementById('searchForm').onsubmit=search;document.getElementById('logout').onclick=logout;document.getElementById('stats').onclick=stats;document.getElementById('query').focus()}
async function search(e){e.preventDefault();const b=document.getElementById('search'),status=document.getElementById('status'),box=document.getElementById('results');b.disabled=true;b.textContent='Searching…';status.textContent='Searching securely…';box.replaceChildren();try{const r=await call('searchCustomers',state.token,document.getElementById('type').value,document.getElementById('query').value);if(!r||!Array.isArray(r.results))throw Error('Search could not be completed.');status.textContent=r.results.length?`${r.resultCount} matching record(s) found.${r.limited?' Showing the first 20.':''}`:'No matching customers found.';r.results.forEach(x=>{const card=document.createElement('article');card.className='customer';card.innerHTML=`<h3>${esc(x.customer)}</h3>${[['Phone 1',x.phone1],['Phone 2',x.phone2],['Email 1',x.email1],['Email 2',x.email2]].filter(y=>y[1]).map(y=>`<div class="field"><b>${y[0]}</b>${esc(y[1])}</div>`).join('')}`;[['Phone 1',x.phone1],['Phone 2',x.phone2]].filter(y=>y[1]).forEach(y=>{const line=document.createElement('div');line.className='actions';const btn=document.createElement('button');btn.className='secondary';btn.textContent='WhatsApp '+y[0];btn.onclick=()=>whatsapp(y[1]);line.append(btn);card.append(line)});box.append(card)})}catch(err){status.textContent=safeError(err);if(/session expired/i.test(status.textContent)){state.token=null;setTimeout(showLogin,1000)}}finally{b.disabled=false;b.textContent='Search'}}
async function whatsapp(phone){let d=String(phone).replace(/\D/g,'');if(/^0(10|11|12|15)\d{8}$/.test(d))d='20'+d.slice(1);window.open('https://wa.me/'+d,'_blank','noopener');try{await call('recordWhatsappClick',state.token,phone)}catch(e){}}
async function stats(){const panel=document.getElementById('statsPanel');panel.classList.remove('hidden');panel.textContent='Loading activity…';try{const x=await call('getEmployeeStats',state.token);panel.innerHTML=`<b>My activity</b><p>Searches: ${Number(x.totalSearches)||0} · Successful: ${Number(x.successfulSearches)||0} · No match: ${Number(x.failedSearches)||0} · WhatsApp clicks: ${Number(x.whatsappClicks)||0}</p>`}catch(e){panel.textContent=safeError(e)}}
async function logout(){const token=state.token;state.token=null;state.user=null;showLogin();if(token)try{await call('logoutUser',token)}catch(e){}}
showLogin();
</script></body></html>
