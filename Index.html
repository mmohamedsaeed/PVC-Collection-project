<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVC Collection</title>
<style>
:root{--bg:#f3f6fb;--surface:#fff;--ink:#14233b;--muted:#718096;--line:#e3eaf3;--brand:#2457d6;--brand2:#13a89e;--brand-soft:#edf3ff;--good:#13845d;--bad:#c44755;--shadow:0 24px 70px rgba(20,40,75,.10);--radius:24px}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 8% 0%,#e6efff 0,transparent 36%),radial-gradient(ellipse at 100% 20%,#e4f7f5 0,transparent 30%),var(--bg);color:var(--ink);min-height:100vh}button,input,select{font:inherit}button{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,opacity .18s ease}.hidden{display:none!important}.wrap{width:min(1120px,100%);margin:auto;padding:30px 24px 48px}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(221,230,242,.9);border-radius:var(--radius);box-shadow:var(--shadow)}.auth{max-width:470px;margin:5vh auto;padding:32px 36px;position:relative;overflow:hidden}.auth:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--brand),var(--brand2))}.brand{font-weight:850;font-size:25px;letter-spacing:-.7px;color:#172b4d}.brand:before{content:"P";display:inline-grid;place-items:center;width:34px;height:34px;margin-right:10px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#4384f5);color:#fff;font-size:18px;vertical-align:middle;box-shadow:0 6px 16px #2457d633}.sub{color:var(--muted);margin:9px 0 18px;font-size:14px}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.035em;color:#52627a;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fbfcff;color:var(--ink);transition:border .2s,box-shadow .2s,background .2s}.field input:focus,.searchbar input:focus,.searchbar select:focus{border-color:#6c93ef;background:#fff;box-shadow:0 0 0 4px #2457d615}.btn{border:0;border-radius:13px;padding:13px 17px;cursor:pointer;font-weight:800;letter-spacing:.01em;position:relative;overflow:hidden}.btn:active{transform:scale(.975)}.primary{background:linear-gradient(110deg,var(--brand),#3976e8);color:#fff;width:100%;box-shadow:0 9px 22px #2457d62e}.primary:hover{box-shadow:0 12px 26px #2457d644;transform:translateY(-1px)}.ghost{background:#eef3fa;color:#34445d}.ghost:hover{background:#e3ebf6}.link{color:var(--brand);cursor:pointer;font-size:13px;font-weight:750}.link:hover{text-decoration:underline}.row{display:flex;gap:10px;align-items:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding:6px 2px}.msg{padding:12px 14px;border-radius:12px;margin:13px 0;font-size:13px;line-height:1.5}.error{background:#fff0f1;color:var(--bad);border:1px solid #f9d9dd}.success{background:#eaf8f2;color:var(--good);border:1px solid #d1efe1}.welcome{text-align:center;padding:22px 24px 18px}.welcome h1{margin:0;font-size:clamp(25px,4vw,34px);letter-spacing:-1px}.welcome p{color:var(--muted);margin:8px 0 12px;font-size:14px}.character{height:138px;position:relative;display:flex;justify-content:center;align-items:center;margin:0 auto 8px;overflow:visible}.character svg{width:220px;height:138px;overflow:visible}.char-head{transform-origin:112px 57px;transform:translateX(var(--look,0px)) rotate(var(--face,0deg));transition:transform .25s ease}.char-body{transform-origin:112px 94px}.char-arm{transform-box:fill-box;transform-origin:top center;transition:transform .25s ease}.char-arm-left{transform:rotate(9deg)}.char-arm-right{transform:rotate(-9deg)}.char-paper{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}.char-leg-a,.char-leg-b{transform-box:fill-box;transform-origin:top center}.character.searching .char-body{animation:charBreath .9s ease-in-out infinite}.character.searching .char-arm-left{animation:shuffleLeft .7s ease-in-out infinite}.character.searching .char-arm-right{animation:shuffleRight .7s ease-in-out infinite}.character.searching .paper-a{animation:paperA .75s ease-in-out infinite}.character.searching .paper-b{animation:paperB .8s ease-in-out .1s infinite}.character.searching .char-head{animation:focusBob 1s ease-in-out infinite}.cover-arms{opacity:0;transition:opacity .18s ease}.character.covering .char-arm{opacity:0}.character.covering .cover-arms{opacity:1}.character.covering .char-head{transform:translateY(-1px)}.character.walking .char-body{animation:walkBody .24s linear infinite}.character.walking .char-leg-a{animation:legA .24s linear infinite}.character.walking .char-leg-b{animation:legB .24s linear infinite}.character.walking{animation:walkAcross 1.45s cubic-bezier(.45,.05,.55,.95) forwards}.character.entering{animation:walkIntoDoor .95s ease-in forwards}.character.entering .char-body{animation:walkBody .18s linear infinite}.character.entering .char-head{animation:none}.character.looking .char-head{transition:transform .12s ease-out}
@keyframes charBreath{50%{transform:translateY(-2px)}}@keyframes focusBob{50%{transform:translateY(-2px)}}@keyframes shuffleLeft{50%{transform:rotate(-18deg) translate(-2px,4px)}}@keyframes shuffleRight{50%{transform:rotate(17deg) translate(2px,4px)}}@keyframes paperA{50%{transform:translate(8px,-4px) rotate(6deg)}}@keyframes paperB{50%{transform:translate(-7px,-2px) rotate(-5deg)}}@keyframes walkBody{50%{transform:translateY(-2px)}}@keyframes legA{50%{transform:rotate(18deg)}}@keyframes legB{50%{transform:rotate(-18deg)}}@keyframes walkAcross{to{transform:translateX(105px)}}@keyframes walkIntoDoor{0%{transform:translateX(0)}70%{transform:translateX(92px)}100%{transform:translateX(130px) scale(.86)}}
.desk-line{stroke:#aeb8c8;stroke-width:3;stroke-linecap:round}.desk-fill{fill:#eef2f7}.ink{stroke:#384457}.skin{fill:#f1c7a5}.shirt{fill:#5b6c84}.hair-fill{fill:#2d3440}.paper-fill{fill:#fff;stroke:#c8d0dc;stroke-width:2}.eye-fill{fill:#263142}.mouth-line{stroke:#6d4d43;stroke-width:2;stroke-linecap:round}.shoe{fill:#344054}.door-scene{position:relative;height:104px;margin:0 22px}.door-frame{position:absolute;right:8%;bottom:0;width:72px;height:88px;border:3px solid #aab7ca;border-bottom:0;border-radius:13px 13px 0 0;background:linear-gradient(145deg,#edf2fa,#dce5f2);box-shadow:inset 0 0 0 5px #fff}.door-panel{position:absolute;inset:5px 5px 0;background:linear-gradient(135deg,#4569a9,#203d70);transform-origin:left center;transition:transform .55s ease;border-radius:7px 7px 0 0}.door-handle{position:absolute;right:10px;top:48%;width:6px;height:6px;border-radius:50%;background:#f7cf77}.door-open .door-panel{transform:perspective(160px) rotateY(-72deg)}
.searchPanel{padding:24px}.searchbar{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:10px;align-items:center}.searchbar select,.searchbar input{padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:#fbfcff;color:var(--ink);outline:none;min-width:0;transition:border .2s,box-shadow .2s}.searchbar .primary{width:auto;min-width:112px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:16px;margin-top:20px}.customer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;animation:cardIn .38s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.customer:hover{transform:translateY(-3px);box-shadow:0 15px 34px rgba(22,45,82,.10);border-color:#d3e0f4}@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}.customer h3{margin:0 0 13px;font-size:17px;letter-spacing:-.2px}.item{padding:11px 0;border-top:1px solid #edf1f6}.item b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}.phoneRow{display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}.phoneRow span{overflow-wrap:anywhere;font-size:13px}.mini{padding:8px 10px;border:0;border-radius:9px;cursor:pointer;background:#eaf1ff;color:#2054ad;font-size:11px;font-weight:800;white-space:nowrap}.mini:hover{transform:translateY(-1px);filter:saturate(1.15)}.wa{background:#e7f7ef;color:#08734c}.email{background:#eef2f8;color:#34445d}.toast{position:fixed;right:18px;bottom:18px;padding:13px 17px;background:#172b4d;color:#fff;border-radius:13px;box-shadow:0 12px 30px #14233b30;display:none;z-index:40}.loading{position:fixed;inset:0;background:rgba(239,244,252,.88);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:20;animation:fadeIn .2s ease}.loading .box{width:min(470px,calc(100vw - 32px));background:#fff;padding:24px 28px 20px;border:1px solid #e4ebf5;border-radius:26px;box-shadow:0 28px 80px rgba(24,48,88,.18);text-align:center;overflow:hidden}.loading .box .character{height:126px}.loading .status{margin-top:8px;color:var(--muted);font-size:13px;font-weight:650}.spin{width:27px;height:27px;border:3px solid #e1e9f5;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto 0}.progress-track{height:7px;background:#edf1f7;border-radius:20px;margin:4px 22px 0;overflow:hidden;position:relative}.progress-track:after{content:"";display:block;width:36%;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--brand2));animation:progressTravel 1.4s ease-in-out infinite}@keyframes progressTravel{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pass-wrap{display:flex;gap:8px;align-items:stretch}.pass-wrap input{flex:1;min-width:0}.show-pass{border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#f2f5fa;color:#34445d;font-weight:800;cursor:pointer;white-space:nowrap}.auth .character{margin-top:2px}.auth .welcome{padding-top:8px}.auth .primary{margin-top:18px}.auth .link{display:inline-block;margin-top:13px}
/* PVC Collection interaction polish */
.brand-lockup{display:flex;flex-direction:column;gap:2px}.brand-lockup .parent{font-size:10px;letter-spacing:.16em;font-weight:850;color:#718096}.brand-lockup .product{font-size:23px;font-weight:900;letter-spacing:-.7px;color:#172b4d}.brand-lockup .product:before{content:"P";display:inline-grid;place-items:center;width:32px;height:32px;margin-right:9px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#4384f5);color:white;font-size:17px;vertical-align:middle}.search-status{grid-column:1/-1;color:var(--muted);font-size:13px;padding:10px 2px}.skeleton{height:172px;border-radius:18px;background:linear-gradient(90deg,#edf1f7 25%,#f8faff 40%,#edf1f7 60%);background-size:220% 100%;animation:shimmer 1.2s ease infinite}.empty-state{text-align:center;padding:28px 18px;color:var(--muted);background:#fff;border:1px dashed #cbd7e8;border-radius:17px}.state-panel{text-align:center;max-width:560px;margin:7vh auto;padding:34px 28px}.state-panel h1{font-size:25px;margin:10px 0}.state-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 16px;background:#edf3ff;color:var(--brand);font-size:30px}.btn:disabled{opacity:.65;cursor:wait;transform:none!important}.field input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #2457d655;outline-offset:2px}@keyframes shimmer{to{background-position:-220% 0}}
@media(max-width:700px){.wrap{padding:14px 12px 32px}.auth{margin:3vh auto;padding:27px 22px}.searchPanel{padding:16px}.searchbar{grid-template-columns:1fr}.searchbar .primary{width:100%}.top{align-items:flex-start;gap:12px}.top .row{flex-wrap:wrap;justify-content:flex-end}.welcome{padding:14px 8px}.welcome h1{font-size:26px}.character svg{width:205px}.customer{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const WEB_APP_URL = <?!= JSON.stringify(WEB_APP_URL) ?>;
const state={token:null,lang:'en',mode:'login'};
const $=id=>document.getElementById(id);
function run(name,args=[]){
  const retryableReads = new Set(['getEmployeeStats']);
  const maxAttempts = retryableReads.has(name) ? 3 : 1;
  function attempt(number){
    return new Promise((resolve,reject)=>{
      const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name](...args);
    }).catch(error=>{
      const message=String(error&&error.message?error.message:error);
      const authFailure=/session expired|administrator access required/i.test(message);
      if(number>=maxAttempts||authFailure)throw error;
      return new Promise(resolve=>setTimeout(resolve,400*Math.pow(2,number-1)))
        .then(()=>attempt(number+1));
    });
  }
  return attempt(1);
}
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function person(extra=''){return `<div class="character ${extra}" aria-hidden="true"><svg viewBox="0 0 220 138" role="img"><g class="char-body"><ellipse cx="112" cy="124" rx="70" ry="5" fill="#e4e8ef"/><path d="M70 105h88" class="desk-line"/><path d="M78 105v16M150 105v16" class="desk-line"/><rect x="86" y="94" width="52" height="8" rx="4" class="desk-fill" stroke="#aeb8c8" stroke-width="2"/><path d="M91 99h40" class="desk-line"/><path d="M96 83c2-17 30-23 46-9l8 20H91z" class="shirt"/><path d="M96 91c-8 9-11 17-5 22 6 4 15-7 19-13" class="skin ink" stroke-width="2"/><path d="M142 91c9 8 12 16 6 22-6 5-15-6-20-12" class="skin ink" stroke-width="2"/><path d="M101 104l-9 17M135 104l12 17" class="ink" stroke-width="6" stroke-linecap="round"/><path d="M86 121h23M139 121h22" class="shoe"/></g><g class="char-head"><ellipse cx="112" cy="53" rx="23" ry="25" class="skin"/><path d="M89 50c0-25 10-34 26-34 18 0 25 12 24 30-7-8-13-11-20-12-10 0-18 6-30 16z" class="hair-fill"/><path d="M95 48c4-3 8-4 12-3M117 45c4-1 8 0 11 3" class="ink" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="104" cy="54" r="2.3" class="eye-fill"/><circle cx="120" cy="54" r="2.3" class="eye-fill"/><path d="M108 64c3 2 6 2 9 0" class="mouth-line" fill="none"/><path d="M91 54c-7 1-8 8-2 10M133 54c7 1 8 8 2 10" class="skin ink" stroke-width="2"/><path d="M102 77h20" class="ink" stroke-width="3" stroke-linecap="round"/></g><g class="char-arm char-arm-left"><path d="M98 89C88 91 82 98 79 105" class="skin ink" stroke-width="7" stroke-linecap="round" fill="none"/></g><g class="char-arm char-arm-right"><path d="M139 89c10 2 17 9 20 16" class="skin ink" stroke-width="7" stroke-linecap="round" fill="none"/></g><g class="char-paper paper-a"><rect x="73" y="103" width="25" height="14" rx="2" class="paper-fill" transform="rotate(-7 85 110)"/><path d="M79 108h12M78 112h9" stroke="#c3cad5" stroke-width="1.5"/></g><g class="cover-arms"><path d="M98 90C101 78 103 66 104 57" class="skin ink" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M139 90C136 78 130 66 120 57" class="skin ink" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="104" cy="55" r="4" class="skin"/><circle cx="120" cy="55" r="4" class="skin"/></g><g class="char-paper paper-b"><rect x="133" y="104" width="25" height="14" rx="2" class="paper-fill" transform="rotate(7 145 111)"/><path d="M139 109h12M140 113h9" stroke="#c3cad5" stroke-width="1.5"/></g></svg></div>`}
function togglePass(id,btn){const x=$(id);const show=x.type==='password';x.type=show?'text':'password';btn.textContent=show?'Hide':'Show'}
function login(){state.mode='login';$('app').innerHTML=`<div class="wrap"><div class="panel auth"><div class="brand-lockup"><span class="parent">CAPITAL HOLDING</span><span class="product">PVC Collection</span></div><div class="sub">Secure customer search portal</div><div class="welcome" style="padding:12px 0 0"><h1>Welcome</h1><p>Sign in to continue</p>${person()}</div><div id="formMsg"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><div class="pass-wrap"><input id="password" type="password" autocomplete="current-password"><button type="button" class="show-pass" onclick="togglePass('password',this)">Show</button></div></div><div class="link" onclick="openReset()">Forgot password?</div><button class="btn primary" onclick="doLogin()">Login</button><div style="text-align:center;margin-top:18px" class="link" onclick="signup()">Create an account</div></div></div>`;const p=$('password'),c=document.querySelector('.auth .character');const react=()=>c.classList.toggle('covering',document.activeElement===p&&p.value.length>0);p.addEventListener('focus',react);p.addEventListener('input',react);p.addEventListener('blur',()=>c.classList.remove('covering'));$('email').addEventListener('focus',()=>c.classList.remove('covering'))}
function signup(){state.mode='signup';$('app').innerHTML=`<div class="wrap"><div class="panel auth"><div class="brand-lockup"><span class="parent">CAPITAL HOLDING</span><span class="product">PVC Collection</span></div><div class="sub">Create your collection account</div>${person()}<div id="formMsg"></div><div class="field"><label>Full name (3+ names)</label><input id="fullName"></div><div class="field"><label>Phone</label><input id="phone" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><div class="pass-wrap"><input id="password" type="password"><button type="button" class="show-pass" onclick="togglePass('password',this)">Show</button></div></div><div class="field"><label>Confirm password</label><div class="pass-wrap"><input id="confirm" type="password"><button type="button" class="show-pass" onclick="togglePass('confirm',this)">Show</button></div></div><button class="btn primary" onclick="doSignup()">Sign up</button><div style="text-align:center;margin-top:18px" class="link" onclick="login()">Back to login</div></div></div>`;const mascot=document.querySelector('.auth .character');['password','confirm'].forEach(id=>{const field=$(id);field.addEventListener('focus',()=>mascot.classList.toggle('covering',field.value.length>0));field.addEventListener('input',()=>mascot.classList.toggle('covering',field.value.length>0));field.addEventListener('blur',()=>mascot.classList.remove('covering'))})}
function showAccountState(kind,message){const pending=kind==='pending';$('app').innerHTML=`<div class="wrap"><section class="panel state-panel"><div class="state-icon">${pending?'◷':'✉'}</div><div class="brand-lockup"><span class="parent">CAPITAL HOLDING</span><span class="product">PVC Collection</span></div><h1>${pending?'Account pending approval':'Verify your email address'}</h1><p style="color:var(--muted);line-height:1.7">${esc(message)}</p><p style="color:var(--muted);font-size:13px">${pending?'Your account will become available after administrator approval.':'Open the verification email sent during registration, then return here to sign in.'}</p><button class="btn primary" onclick="login()">Back to sign in</button></section></div>`}
function showMsg(t,bad=true){$('formMsg').innerHTML=`<div class="msg ${bad?'error':'success'}">${esc(t)}</div>`}
function load(){ $('app').innerHTML=`<div class="wrap"><div class="top"><div><div class="brand-lockup"><span class="parent">CAPITAL HOLDING</span><span class="product">PVC Collection</span><span style="color:var(--muted);font-size:13px">Customer search</span></div></div><div class="row"><button class="btn ghost" onclick="showMyStats()">My activity</button><button class="btn ghost" onclick="logout()">Logout</button></div></div><div class="panel searchPanel"><div class="welcome"><h1>Welcome</h1><p>Search by customer name, phone, or email.</p>${person()}</div><div class="searchbar"><select id="stype" aria-label="Search type"><option value="name">Name</option><option value="phone">Phone</option><option value="email">Email</option></select><input id="q" aria-label="Customer search query" placeholder="Search by name, phone, or email..."><button id="searchBtn" class="btn primary" style="width:auto" onclick="search()">Search</button></div><div id="searchStatus" class="search-status" role="status" aria-live="polite"></div><div id="results" class="results" aria-live="polite"></div></div><div id="stats" class="panel searchPanel hidden" style="margin-top:18px"></div></div>`;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('results').addEventListener('mousemove',followMouseToCard);$('results').addEventListener('mouseleave',()=>resetCharacterLook())}
async function showMyStats(){try{const d=await run('getEmployeeStats',[state.token]);$('stats').classList.remove('hidden');$('stats').innerHTML=`<div class="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div><b>Searches</b><div style="font-size:28px;font-weight:800">${d.totalSearches}</div></div><div><b>Successful</b><div style="font-size:28px;font-weight:800">${d.successfulSearches}</div></div><div><b>Failed</b><div style="font-size:28px;font-weight:800">${d.failedSearches}</div></div><div><b>WhatsApp clicks</b><div style="font-size:28px;font-weight:800">${d.whatsappClicks}</div></div></div>`}catch(e){toast(e.message||String(e))}}
async function doLogin(){const email=$('email').value,password=$('password').value;const started=Date.now();setLoading(true,true);try{const r=await run('loginUser',[{email,password}]);state.token=r.sessionToken;const role=String(r.user&&r.user.role||'').toUpperCase();if(role==='ADMIN'){setLoading(false);const base=String(WEB_APP_URL||'').replace(/\/+$/,'');window.location.href=base+'?action=admin';return}if(role!=='EMPLOYEE'){await run('logoutUser',[state.token]).catch(()=>{});state.token=null;setLoading(false);showMsg('This account does not have permission to access the employee portal.');return}const wait=Math.max(0,900-(Date.now()-started));setTimeout(()=>{const c=document.querySelector('#load .character');if(c){c.classList.remove('walking');c.classList.add('entering');document.querySelector('#load .door-scene')?.classList.add('door-open')}setTimeout(()=>{setLoading(false);load()},420)},wait)}catch(e){setLoading(false);const message=e.message||String(e);if(/waiting for administrator approval/i.test(message)){showAccountState('pending',message)}else if(/verify your email/i.test(message)){showAccountState('verify',message)}else{showMsg(message)}}}
async function doSignup(){const f={fullName:$('fullName').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),password:$('password').value,confirmPassword:$('confirm').value};try{const r=await run('signupUser',[f]);showAccountState('verify',r.message||'Account created. Please check your email to verify your account.')}catch(e){showMsg(e.message||String(e))}}
function openReset(){const base=String(WEB_APP_URL||'').replace(/\/+$/,'');window.open(base+'?action=reset','_blank','noopener')}
async function logout(){try{await run('logoutUser',[state.token])}catch(e){}state.token=null;login()}
async function search(){const q=$('q').value.trim();const button=$('searchBtn');const status=$('searchStatus');if(!q){status.textContent='Enter a name, phone number, or email to search.';$('q').focus();return}const c=document.querySelector('.welcome .character');if(c)c.classList.add('searching');button.disabled=true;button.textContent='Searching…';status.textContent='Searching the customer database…';$('results').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';try{const r=await run('searchCustomers',[state.token,$('stype').value,q]);renderResults(r.results||[],!!r.limited);status.textContent=(r.results||[]).length?`${r.resultCount||r.results.length} matching record(s) found.`:'No matching customers found.'}catch(e){$('results').innerHTML='<div class="empty-state">Search could not be completed. Please try again.</div>';status.textContent=e.message||String(e);if(/session expired|session required/i.test(status.textContent)){state.token=null;setTimeout(login,900)}}finally{button.disabled=false;button.textContent='Search';if(c)c.classList.remove('searching')}}
function renderResults(rs,limited=false){const box=$('results');if(!rs.length){box.innerHTML='<div class="msg error">No customers found.</div>';return}const notice=limited?'<div class="msg">Showing the first 20 matching customers. Refine your search to narrow the results.</div>':'';box.innerHTML=notice+rs.map((r,i)=>`<div class="customer" data-i="${i}" style="animation-delay:${Math.min(i*55,360)}ms"><h3>${esc(r.customer)}</h3>${phones(r.phone1,'Phone 1')}${phones(r.phone2,'Phone 2')}${emails(r.email1,'Email 1')}${emails(r.email2,'Email 2')}</div>`).join('')}
function resetCharacterLook(){const char=document.querySelector('.welcome .character');if(!char)return;char.style.setProperty('--look','0px');char.style.setProperty('--face','0deg');char.classList.remove('looking')}
function followMouseToCard(e){const card=e.target.closest('.customer');const char=document.querySelector('.welcome .character');if(!card||!char){return resetCharacterLook()}const head=char.querySelector('.char-head');if(!head)return;const a=card.getBoundingClientRect();const x=e.clientX-(a.left+a.width/2);const face=Math.max(-12,Math.min(12,x/18));const move=Math.max(-9,Math.min(9,x/35));char.style.setProperty('--look',move+'px');char.style.setProperty('--face',face+'deg');char.classList.add('looking')}
function phones(v,label){if(!v)return'';const ps=v.split(/[,،;\n\r]+/).map(x=>x.trim()).filter(Boolean);return `<div class="item"><b>${label}</b>${ps.map(p=>`<div class="phoneRow"><span>${esc(p)}</span><button class="mini wa" onclick="wa('${escAttr(p)}')">WhatsApp</button></div>`).join('')}</div>`}
function emails(v,label){if(!v)return'';return `<div class="item"><b>${label}</b><div class="phoneRow"><span>${esc(v)}</span><button class="mini email" onclick="mail('${escAttr(v)}')">Email</button></div></div>`}
function escAttr(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
async function wa(p){window.open('https://wa.me/'+waNumber(p),'_blank','noopener');try{await run('recordWhatsappClick',[state.token,p])}catch(e){}}
function mail(e){window.location.href='mailto:'+encodeURIComponent(e)}
function waNumber(p){let d=String(p||'').replace(/\D/g,'');if(/^0(10|11|12|15)\d{8}$/.test(d))d='20'+d.slice(1);return d}
function setLoading(on,loginFlow=false){let x=$('load');if(on){if(!x){document.body.insertAdjacentHTML('beforeend',`<div class="loading" id="load"><div class="box"><div class="character walking">${person('loader-char').replace(/^<div class="character [^"]*" aria-hidden="true">/,'').replace(/<\/div>$/,'')}</div><div class="door-scene"><div class="door-frame"><div class="door-panel"></div><div class="door-handle"></div></div></div><div class="progress-track" aria-hidden="true"></div><div class="status">Preparing your secure workspace…</div></div></div>`)} }else if(x)x.remove()}
login();
</script></body></html>
